[app]
title = Su Ayak Izi Katalogu
package.name = suayakizi
package.domain = org.test
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,json,html,css,js
version = 1.0.0

# Flask ve Android WebView servis bağımlılıkları
requirements = python3,kivy,flask,jinja2,markupsafe,werkzeug,android

orientation = portrait
fullscreen = 0

android.permissions = INTERNET
android.api = 33
android.minapi = 21
android.archs = arm64-v8a

# WebView veya Bootstrap ayarı
p4a.bootstrap = webview
